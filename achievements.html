<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements & Highlights</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d1f3c 50%, #0a1628 100%);
      min-height: 100vh;
      color: #c8daf0;
    }

    .top-line {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00d4ff, transparent);
    }

    header {
      text-align: center;
      padding: 3.5rem 1.5rem 2.5rem;
    }

    .emoji {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #fff;
      text-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
    }

    .subtitle {
      font-size: 1rem;
      max-width: 32rem;
      margin: 0 auto;
      color: #7a9cc6;
    }

    .card-grid {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 1.25rem;
      padding: 0 1.5rem;
      margin-bottom: 5rem;
      max-width: 1500px;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 768px) {
      .card-grid {
        flex-direction: column;
        padding: 0 1.5rem;
      }

      h1 {
        font-size: 2rem;
      }
    }

    @media (min-width: 1024px) {
      .card-grid {
        padding: 0 4rem;
      }
    }

    .card {
      flex: 1;
      min-width: 250px;
      border-radius: 1rem;
      overflow: hidden;
      background: linear-gradient(160deg, #132d66 0%, #0f2248 100%);
      border: 1px solid rgba(0, 212, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
      animation: slideUp 0.6s ease forwards;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 212, 255, 0.15);
      border-color: rgba(0, 212, 255, 0.3);
    }

    .card-header {
      padding: 1.25rem;
      border-bottom: 1px solid rgba(0, 212, 255, 0.08);
    }

    .card-icon {
      font-size: 1.875rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #6bb6ff;
    }

    .items-container {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .item {
      border-radius: 0.5rem;
      overflow: hidden;
      transition: background 0.2s;
    }

    .item.open {
      background: rgba(0, 212, 255, 0.05);
    }

    .item-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.625rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #c8daf0;
      border-radius: 0.5rem;
      transition: background 0.2s;
      text-align: left;
    }

    .item-button:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .item-name {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .dot {
      width: 0.375rem;
      height: 0.375rem;
      border-radius: 50%;
      background: #00d4ff;
      box-shadow: 0 0 6px rgba(0, 212, 255, 0.5);
      flex-shrink: 0;
    }

    .chevron {
      width: 0.875rem;
      height: 0.875rem;
      flex-shrink: 0;
      color: #5a7a9e;
      transition: transform 0.3s ease;
    }

    .chevron.open {
      transform: rotate(180deg);
    }

    .item-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-in-out;
    }

    .item-detail.open {
      max-height: 200px;
    }

    .detail-text {
      padding: 0.75rem;
      font-size: 0.75rem;
      color: #7a9cc6;
      background: rgba(0, 0, 0, 0.15);
      border: 1px dashed rgba(0, 212, 255, 0.1);
      border-radius: 0.375rem;
      cursor: pointer;
      transition: border-color 0.2s;
      display: block;
    }

    .detail-text:hover {
      border-color: rgba(0, 212, 255, 0.3);
    }

    .edit-hint {
      color: #3a6a9e;
      font-size: 10px;
    }

    .detail-input {
      width: 100%;
      padding: 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      color: #c8daf0;
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 0.375rem;
      min-height: 60px;
      outline: none;
      font-family: inherit;
      font-size: 0.75rem;
      resize: none;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="top-line"></div>

  <header>
    <p class="emoji">✨</p>
    <h1>Achievements & Highlights</h1>
    <p class="subtitle">Explore our journey of excellence in physics education and research</p>
  </header>

  <section class="card-grid" id="cardGrid"></section>

  <script>
    const initialSections = [
      {
        title: "Major Events Conducted",
        icon: "🎯",
        items: [
          { name: "Mathletics (Year, participation stats)", detail: "More details can be added here later." },
          { name: "Physics Odyssey Circle Sessions", detail: "More details can be added here later." },
        ],
      },
      {
        title: "Publications",
        icon: "📚",
        items: [
          { name: "Annual Magazine (2025, Issue 01)", detail: "More publication information can be added." },
          { name: "Newsletter Issues (04 published, 1 upcoming)", detail: "More publication information can be added." },
          { name: "Featured Student Articles", detail: "More publication information can be added." },
        ],
      },
      {
        title: "Distinguished Talks & Speakers",
        icon: "🎤",
        items: [
          { name: "Alumni Talks (1 held till now)", detail: "Future speaker events can be listed here." },
          { name: "Invited Scholars (2 talks conducted)", detail: "Future speaker events can be listed here." },
        ],
      },
      {
        title: "Milestones",
        icon: "🏆",
        items: [
          { name: "Launch of Physics Odyssey Circle", detail: "Additional milestones can be added later." },
          { name: "Website Launch", detail: "Additional milestones can be added later." },
        ],
      },
    ];

    let openItems = {};
    let editing = null;
    const cardGrid = document.getElementById("cardGrid");

    function toggleItem(key) {
      openItems[key] = !openItems[key];
      render();
    }

    function setEditing(key) {
      editing = key;
      render();
      if (editing) setTimeout(() => document.querySelector('.detail-input')?.focus(), 0);
    }

    function updateDetail(sectionIdx, itemIdx, newDetail) {
      initialSections[sectionIdx].items[itemIdx].detail = newDetail;
    }

    function render() {
      cardGrid.innerHTML = initialSections.map((section, i) => {
        return `
          <div class="card" style="animation-delay: ${0.15 * i}s;">
            <div class="card-header">
              <span class="card-icon">${section.icon}</span>
              <h2 class="card-title">${section.title}</h2>
            </div>
            <div class="items-container">
              ${section.items.map((item, j) => {
                const key = `${i}-${j}`;
                const isOpen = openItems[key];
                const isEditing = editing === key;
                return `
                  <div class="item ${isOpen ? 'open' : ''}">
                    <button class="item-button" onclick="toggleItem('${key}')">
                      <span class="item-name">
                        <span class="dot"></span>
                        ${item.name}
                      </span>
                      <svg class="chevron ${isOpen ? 'open' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                      </svg>
                    </button>
                    <div class="item-detail ${isOpen ? 'open' : ''}">
                      <div style="padding: 0.75rem;">
                        ${isEditing ? 
                          `<textarea class="detail-input" onblur="setEditing(null)" onkeydown="if(event.key==='Escape'){setEditing(null);}else if(event.key==='Enter'&&event.ctrlKey){updateDetail(${i},${j},this.value);setEditing(null);}">${item.detail}</textarea>` 
                          : `<p class="detail-text" onclick="setEditing('${key}')">${item.detail} <span class="edit-hint">✏️ click to edit</span></p>`
                        }
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggleItem = toggleItem;
    window.setEditing = setEditing;
    window.updateDetail = updateDetail;

    render();
  </script>
</body>
</html>
